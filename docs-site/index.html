<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISOLeaf Docs</title>
<link rel="canonical" href="https://docs.isoleaf.dev/">
<meta http-equiv="refresh" content="0; url=/pt/">
<script>
  // Pick locale from the browser when JS is available; fall back to /pt/.
  (function () {
    var lang = (navigator.language || "pt").toLowerCase();
    var target = lang.startsWith("pt") ? "/pt/" : "/en/";
    location.replace(target);
  })();
</script>
</head>
<body>
<p>Redirecting to <a href="/pt/">/pt/</a>…</p>
</body>
</html>
