version: '3.8'
services:
  mongodb:
    image: mongo:7
    container_name: iso8583_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16
    container_name: iso8583_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: iso8583_identity
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: iso8583_redis
    ports:
      - "6379:6379"

  seq:
    image: datalust/seq:latest
    container_name: iso8583_seq
    ports:
      - "5341:5341"
      - "8081:80"
    environment:
      ACCEPT_EULA: Y

volumes:
  mongo_data:
  pg_data:
