name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Weekly CodeQL sweep so newly-published advisories are caught even when
  # the codebase is quiet — fires the whole pipeline; `docker` self-gates
  # via its own `if:` and stays a no-op.
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC

# Cancel superseded runs on the same ref — saves CI minutes on every
# rapid push (previous run gets terminated the moment a new commit
# lands, not only for PRs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum-privilege default; jobs that need more declare it locally.
permissions:
  contents: read

jobs:
  # ── Stage 1 ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Explicit NuGet cache — no packages.lock.json in the repo, so we
      # hash every csproj and any version bump busts the cache.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Iso8583Toolkit.sln

      - name: Build
        run: dotnet build Iso8583Toolkit.sln --configuration Release --no-restore --no-incremental

      - name: Test
        run: dotnet test Iso8583Toolkit.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload .trx results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-trx
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  # ── Stage 2 ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/isohub
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache the full node_modules keyed on package-lock.json so a warm
      # run skips `npm ci` entirely. `id:` is required so the Install
      # step below can read cache-hit output.
      - name: Cache npm packages
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: frontend/isohub/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/isohub/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # ── Stage 3 ────────────────────────────────────────────────────────────────
  gitleaks:
    name: Secret scan (Trufflehog)
    needs: [backend, frontend]
    # Skip on tag pushes — the tag is created on top of a main commit
    # that has already been scanned, so re-running here just burns
    # minutes and delays the release build.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required so the scanner can walk every commit
          # reachable from this ref, not just the tip.
          fetch-depth: 0

      - name: Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          # --only-verified suppresses unverified candidates (low signal/noise);
          # only credentials Trufflehog could actively validate against their
          # issuing service will fail the build.
          extra_args: --only-verified

  # ── Stage 4 ────────────────────────────────────────────────────────────────
  # CodeQL Advanced — uses .github/codeql/codeql-config.yml to suppress the
  # ECB-mandated-by-EMV and catch-of-all-exceptions false positives. Runs in
  # parallel with `gitleaks`. csharp uses `build-mode: manual` so we can
  # reuse the NuGet cache (autobuild's separate build would download every
  # package again from scratch — ~3min wasted).
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: [backend, frontend]
    # Only run on PRs (any branch → main) and on pushes to main; feature
    # branch pushes skip CodeQL to save ~8min per run. Branch protection
    # for merges into main must accept "skipped" for these checks.
    if: |
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two ceilings via matrix expression: csharp needs the manual dotnet
    # build (~5min more) so gets a longer leash than the JS analyser.
    timeout-minutes: ${{ matrix.language == 'csharp' && 20 || 15 }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # The `javascript` analyser also covers TypeScript.
        language: [csharp, javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        if: matrix.language == 'csharp'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        if: matrix.language == 'csharp'
        run: dotnet restore Iso8583Toolkit.sln

      - name: Init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml
          # csharp builds explicitly below so the cached restore is honoured;
          # javascript reads source files directly.
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}

      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build Iso8583Toolkit.sln --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ── Stages 5 + 6 (merged: build-push-action is atomic) ─────────────────────
  # v3.0 (Sprint 12.5) — the single `isoleaf` image was split into two,
  # one per host process. Matrix strategy fans out to `backend` and `agent`
  # runs of build-push-action; the shared frontend+dotnet-build stages in
  # the Dockerfile are reused via the GHA build cache, so the second job
  # picks up the layer results of the first almost instantly.
  docker:
    name: Docker build & push — ${{ matrix.image }} (GHCR)
    needs: [backend, frontend, gitleaks, codeql]
    # `always()` forces evaluation even when a `needs` job is skipped —
    # without it, GitHub short-circuits to the implicit `success()` gate
    # and marks docker as skipped whenever gitleaks/codeql are (e.g. on
    # tag pushes). backend/frontend must strictly succeed; gitleaks and
    # codeql may be skipped (they gate themselves off tags / feature
    # branches). The trailing branch filter keeps docker out of feature
    # branch pushes even when all the above are green.
    if: |
      always() &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      (needs.gitleaks.result == 'success' || needs.gitleaks.result == 'skipped') &&
      (needs.codeql.result == 'success' || needs.codeql.result == 'skipped') &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Each image is independently publishable — one failing (e.g. GHCR
      # rate limit on the second push) shouldn't cancel the other's
      # already-in-flight push. Same reason `docker/build-push-action`
      # uses provenance:false-by-default in a matrix like this.
      fail-fast: false
      matrix:
        include:
          - image: backend
            ghcr: ghcr.io/isoleaf-io/isoleaf-backend
            target: runtime-backend
          - image: agent
            ghcr: ghcr.io/isoleaf-io/isoleaf-agent
            target: runtime-agent
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.ghcr }}
          # `latest` on main, `3.0.0` on tag `v3.0.0`, `3.0` and `3` on the same.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shared cache scope so the second matrix leg picks up the
          # frontend-build + dotnet-build layers the first one populated,
          # instead of rebuilding them from scratch.
          cache-from: type=gha,scope=docker-shared
          cache-to: type=gha,mode=max,scope=docker-shared

  # ── Stage 5 (parallel with docker) ────────────────────────────────────────
  # Framework-dependent portable zip attached as a GitHub Release asset on
  # every `v*` tag. Same gate as `docker`: backend+frontend must strictly
  # succeed; gitleaks/codeql may be skipped (they gate themselves off tag
  # pushes). Only fires on tag pushes — main pushes don't produce a portable
  # asset because there is no Release object to attach to.
  portable:
    name: Portable zip (framework-dependent)
    needs: [backend, frontend, gitleaks, codeql]
    if: |
      always() &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      (needs.gitleaks.result == 'success' || needs.gitleaks.result == 'skipped') &&
      (needs.codeql.result == 'success' || needs.codeql.result == 'skipped') &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # softprops/action-gh-release creates the release + uploads asset
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node 20
        # Agent's csproj target BuildFrontend runs `npm install && npm run
        # build` during dotnet publish -c Release; Node must be on the PATH
        # for that to succeed on the CI runner.
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: frontend/isohub/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/isohub/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Publish Backend + Agent (framework-dependent, cross-platform)
        # No -r/RuntimeIdentifier and no PublishSingleFile: a single .dll
        # payload per project runs on Windows/Mac/Linux as long as the
        # .NET 9 Runtime is installed. Backend's csproj target BuildFrontend
        # runs `npm install && npm run build` during Release publish and
        # drops the SPA into wwwroot — no separate frontend step needed.
        # v3.0 (Sprint 12.5) publishes BOTH host processes side by side.
        run: |
          dotnet publish agent/Iso8583Toolkit.Backend/Iso8583Toolkit.Backend.csproj \
            -c Release -o publish/portable/backend --no-self-contained
          dotnet publish agent/Iso8583Toolkit.Agent/Iso8583Toolkit.Agent.csproj \
            -c Release -o publish/portable/agent --no-self-contained

      - name: Write launcher scripts and README
        run: |
          # Windows: `start` opens each process in its own console window
          # so the user can watch both, and closing one doesn't kill the
          # other. Both windows carry a descriptive title.
          cat > publish/portable/run.bat <<'BAT'
          @echo off
          echo Starting ISOLeaf Backend on http://localhost:8080 ...
          echo Starting ISOLeaf Agent   on http://localhost:8583 ...
          echo (both require .NET 9 Runtime: https://dotnet.microsoft.com/download/dotnet/9.0)
          echo.
          start "ISOLeaf Backend" cmd /k "cd backend && dotnet Iso8583Toolkit.Backend.dll"
          start "ISOLeaf Agent"   cmd /k "cd agent   && dotnet Iso8583Toolkit.Agent.dll"
          echo.
          echo When both windows report "Now listening on...", open:
          echo   http://localhost:8080  (Backend + SPA)
          echo Then Workspace tab "Simulador" -> set Agent URL to http://localhost:8583
          pause
          BAT

          # Mac/Linux: spawn both in the background, wait on either — a
          # single Ctrl+C then terminates the whole group (trap forwards
          # SIGINT/SIGTERM). /bin/sh keeps the script portable across
          # default shells (bash on Linux, zsh on modern Mac).
          cat > publish/portable/run.sh <<'SH'
          #!/bin/sh
          echo "Starting ISOLeaf Backend on http://localhost:8080 ..."
          echo "Starting ISOLeaf Agent   on http://localhost:8583 ..."
          echo "(both require .NET 9 Runtime: https://dotnet.microsoft.com/download/dotnet/9.0)"

          HERE="$(cd "$(dirname "$0")" && pwd)"

          (cd "$HERE/backend" && dotnet Iso8583Toolkit.Backend.dll) &
          BACKEND_PID=$!
          (cd "$HERE/agent"   && dotnet Iso8583Toolkit.Agent.dll)   &
          AGENT_PID=$!

          trap 'kill $BACKEND_PID $AGENT_PID 2>/dev/null; wait' INT TERM
          echo ""
          echo "Backend PID $BACKEND_PID  ·  Agent PID $AGENT_PID"
          echo "When both report \"Now listening on...\", open http://localhost:8080"
          echo "Then Workspace tab 'Simulador' -> set Agent URL to http://localhost:8583"
          wait
          SH
          chmod +x publish/portable/run.sh

          cat > publish/portable/README-PORTABLE.txt <<TXT
          ISOLeaf ${{ github.ref_name }} — portable (framework-dependent)

          Prerequisite: .NET 9 Runtime
            https://dotnet.microsoft.com/download/dotnet/9.0

          Run:
            Windows        →  run.bat  (or double-click)
            macOS / Linux  →  ./run.sh

          Two processes will start:
            Backend  on  http://localhost:8080   (SPA + utility APIs)
            Agent    on  http://localhost:8583   (Simulator + SignalR + TCP)

          Then:
            1. Open http://localhost:8080 in your browser.
            2. Go to Workspace, open the "Simulador" tab, enter
                 http://localhost:8583
               as the Agent URL and click Conectar.

          The Agent URL is stored in your browser (localStorage) so this
          only has to be done once per browser profile.

          ─────────────────────────────────────────────────────────────
          Changing the default ports (8080 / 8583)
          ─────────────────────────────────────────────────────────────

          Each host reads its port with priority:
            1. ASPNETCORE_URLS  (standard .NET env var)
            2. "Agent:Port" key in appsettings.json  (fallback)
            3. Hardcoded default  (8080 / 8583)

          Option A (recommended for the portable) — edit appsettings.json
          in each subfolder, then re-run the launcher:

            backend/appsettings.json  ->  "Agent": { "Port": 9090 }
            agent/appsettings.json    ->  "Agent": { "Port": 9091 }

          The config key is "Agent:Port" in BOTH hosts — carry-over from
          an earlier rename, not a typo.

          Option B — set ASPNETCORE_URLS before launching. Because
          run.bat / run.sh start both processes in the same shell, the
          env var would collide (both hosts trying the same port), so
          this only works if you launch each host manually:

            Windows CMD:
              cd backend && set ASPNETCORE_URLS=http://localhost:9090 && dotnet Iso8583Toolkit.Backend.dll
              cd agent   && set ASPNETCORE_URLS=http://localhost:9091 && dotnet Iso8583Toolkit.Agent.dll

            macOS / Linux (two terminals):
              cd backend && ASPNETCORE_URLS=http://localhost:9090 dotnet Iso8583Toolkit.Backend.dll
              cd agent   && ASPNETCORE_URLS=http://localhost:9091 dotnet Iso8583Toolkit.Agent.dll

          If you change the Agent's port, remember to point
          Workspace -> Simulador at the new URL in the browser.

          Same payload runs on Windows, macOS and Linux — no per-OS build.
          TXT

      - name: Zip payload
        # Zip from inside the publish/ dir so the archive expands to
        # `isoleaf-portable-vX.Y.Z/` (no double nesting). No RID in the
        # name: the same zip serves Windows/Mac/Linux.
        run: |
          cd publish
          mv portable "isoleaf-portable-${{ github.ref_name }}"
          zip -r "isoleaf-portable-${{ github.ref_name }}.zip" "isoleaf-portable-${{ github.ref_name }}"
          ls -lh "isoleaf-portable-${{ github.ref_name }}.zip"

      - name: Create GitHub Release and upload asset
        # Creates the Release if it doesn't exist yet (first job to run on
        # the tag), or reuses it if the docker job's downstream tooling
        # already made one. `generate_release_notes` fills the body with
        # commits since the previous tag so we don't have to hand-write
        # anything for point releases.
        uses: softprops/action-gh-release@v2
        with:
          files: publish/isoleaf-portable-${{ github.ref_name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
