name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Weekly CodeQL sweep so newly-published advisories are caught even when
  # the codebase is quiet — fires the whole pipeline; `docker` self-gates
  # via its own `if:` and stays a no-op.
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC

# Cancel superseded runs on the same ref — saves CI minutes on PR pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimum-privilege default; jobs that need more declare it locally.
permissions:
  contents: read

jobs:
  # ── Stage 1 ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          # No packages.lock.json in the repo — fall back to hashing every
          # csproj so any version bump busts the cache.
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Iso8583Toolkit.sln

      - name: Build
        run: dotnet build Iso8583Toolkit.sln --configuration Release --no-restore --no-incremental

      - name: Test
        run: dotnet test Iso8583Toolkit.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload .trx results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-trx
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  # ── Stage 2 ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/isohub
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/isohub/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # ── Stage 3 ────────────────────────────────────────────────────────────────
  gitleaks:
    name: Secret scan (Trufflehog)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required so the scanner can walk every commit
          # reachable from this ref, not just the tip.
          fetch-depth: 0

      - name: Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          # --only-verified suppresses unverified candidates (low signal/noise);
          # only credentials Trufflehog could actively validate against their
          # issuing service will fail the build.
          extra_args: --only-verified

  # ── Stage 4 ────────────────────────────────────────────────────────────────
  # CodeQL Advanced — uses .github/codeql/codeql-config.yml to suppress the
  # ECB-mandated-by-EMV and catch-of-all-exceptions false positives. Runs in
  # parallel with `gitleaks`. csharp uses `build-mode: manual` so we can
  # reuse the NuGet cache (autobuild's separate build would download every
  # package again from scratch — ~3min wasted).
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # The `javascript` analyser also covers TypeScript.
        language: [csharp, javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        if: matrix.language == 'csharp'
        run: dotnet restore Iso8583Toolkit.sln

      - name: Init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml
          # csharp builds explicitly below so the cached restore is honoured;
          # javascript reads source files directly.
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}

      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build Iso8583Toolkit.sln --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ── Stages 5 + 6 (merged: build-push-action is atomic) ─────────────────────
  docker:
    name: Docker build & push (GHCR)
    needs: [gitleaks, codeql]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/isoleaf-io/isoleaf
          # `latest` on main, `1.2.0` on tag `v1.2.0`, `1.2` and `1` on the same.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
